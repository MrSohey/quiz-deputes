# Publication sur GitHub Pages, à chaque poussée sur `main`.
#
# Les portraits ne sont ni copiés ni hébergés : ils sont affichés par lien depuis le
# serveur de l'Assemblée, qui autorise expressément les liens vers son contenu
# (CLAUDE.md §6.3). Le jeu reste gratuit, sans publicité et non commercial, ce que
# ses mentions légales exigent.
#
# Une demande d'autorisation explicite a été envoyée et attend réponse. Publier sans
# l'attendre n'engage rien d'irréversible : un refus se traiterait en basculant la
# source des images vers Wikimedia Commons, où 93 % des députés ont un portrait
# libre (§6.3).
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
